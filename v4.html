<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1A35C9">
<title>Welcome to BPES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --royal: #1A35C9;
    --royal-deep: #10227F;
    --gold: #FFC21A;
    --gold-soft: #FFE48A;
    --sky: #EEF2FF;
    --white: #FFFFFF;
    --ink: #0E1A5C;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    text-align: center;
  }
  .hidden { display: none !important; }
  .welcome-title, .step-title, .next-title, .next-text, .step-text, .purpose-desc { text-wrap: balance; }

  /* Welcome heading */
  .welcome-title {
    margin: 4px 0 0;
    font-weight: 800;
    font-size: clamp(2.4rem, 11vw, 3.4rem);
    line-height: 1;
    color: var(--royal);
    letter-spacing: -0.01em;
    opacity: 0;
    transform: scale(0.6);
  }

  /* Panther stage */
  .stage {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sun {
    position: absolute;
    width: min(64vw, 33vh);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold) 0 58%, var(--gold-soft) 59% 72%, transparent 73%);
    transform: scale(0);
  }
  #confetti {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .panther {
    position: relative;
    height: min(30vh, 58vw);
    width: auto;
    transform: translateY(110vh);
    filter: drop-shadow(0 10px 0 rgba(16, 34, 127, 0.18));
  }

  /* Language picker */
  .pick {
    margin-top: 10px;
    width: 100%;
    max-width: 420px;
    opacity: 0;
    transform: translateY(24px);
  }
  .pick-prompt {
    margin: 0 0 12px;
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.3;
    color: var(--ink);
  }
  .pick-prompt span { display: block; }
  .lang-list {
    display: grid;
    gap: 10px;
  }
  .lang {
    display: block;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: 18px;
    background: var(--royal);
    color: var(--white);
    font: inherit;
    font-weight: 800;
    font-size: 1.35rem;
    box-shadow: 0 5px 0 var(--royal-deep);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .lang:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--royal-deep);
  }
  .lang:focus-visible {
    outline: 4px solid var(--gold);
    outline-offset: 3px;
  }

  /* Main office hours on the welcome screen: plain text, small */
  .hours {
    width: 100%;
    max-width: 420px;
    margin-top: 18px;
    color: var(--ink);
    opacity: 0;
    transform: translateY(24px);
  }
  .hours-title { margin: 0 0 2px; font-weight: 800; font-size: 1rem; line-height: 1.2; color: var(--royal); }
  .hours-cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; line-height: 1.25; }
  .hours-col { display: flex; flex-direction: column; align-items: center; }
  .hours-day { font-weight: 800; font-size: 0.95rem; }
  .hours-time { font-weight: 600; font-size: 0.92rem; white-space: nowrap; }
  .hours-label { margin-top: 2px; font-weight: 600; font-size: 0.78rem; color: #4A5490; }
  @media (max-width: 359px) {
    .hours-time { font-size: 0.82rem; }
    .hours-day { font-size: 0.88rem; }
  }

  /* Centered content for the "How can we help" and "Select your scholar" steps */
  .center-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    text-align: center;
  }
  .center-wrap { justify-content: flex-start; overflow-y: auto; margin-bottom: 12px; }
  .center-inner { margin: auto 0; padding: 4px 2px; }
  .center-wrap .step-title { margin: 0 0 18px; }

  /* Picked scholars (one or more) */
  .picked-list { display: grid; gap: 10px; }
  .picked-list:empty { display: none; }
  .picked-item {
    display: flex; align-items: center; gap: 10px;
    min-height: 64px; padding: 8px 8px 8px 18px;
    border: 3px solid var(--gold); border-radius: 18px;
    background: var(--white); text-align: left;
  }
  .picked-item .scholar-name { flex: 1 1 auto; min-width: 0; font-size: 1.35rem; }
  .remove {
    flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: var(--sky); color: var(--royal); cursor: pointer;
    display: grid; place-items: center;
  }
  .add-another {
    width: 100%; margin-top: 12px; min-height: 54px;
    border: 3px dashed var(--royal); border-radius: 18px;
    background: transparent; color: var(--royal);
    font: inherit; font-weight: 800; font-size: 1.15rem; cursor: pointer;
  }
  .picked-list:not(:empty) + #search-area { margin-top: 14px; }
  .remove:focus-visible, .add-another:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

  /* Errors stand out from normal text */
  .error-box {
    margin: 0 0 12px; padding: 10px 14px;
    border: 2px solid #D93A3A; border-radius: 14px;
    background: #FFF1F0; color: #8A1C14;
    font-size: 1rem; line-height: 1.4; text-align: left;
  }
  .search { text-align: center; }
  .matches { margin-top: 12px; display: grid; gap: 8px; }
  .scholar { text-align: center; margin: 0; }
  .match-note { margin: 4px 0 0; font-size: 1.05rem; line-height: 1.4; color: #4A5490; }
  .step-bottom { width: 100%; max-width: 420px; margin: 0 auto; }
  .home-btn { max-width: 420px; margin-top: 28px; }

  /* Next step placeholder */
  .next-panther { height: 26vh; }
  #thanks { justify-content: center; }
  .next-title {
    margin: 18px 0 8px;
    font-weight: 800;
    font-size: 2rem;
    line-height: 1.1;
    color: var(--royal);
  }
  .next-text { margin: 0; font-size: 1.15rem; line-height: 1.4; max-width: 30ch; }
  .back {
    margin-top: auto;
    min-height: 48px;
    padding: 0 28px;
    border: 3px solid var(--royal);
    border-radius: 16px;
    background: var(--white);
    color: var(--royal);
    font: inherit;
    font-weight: 800;
    font-size: 1.1rem;
    cursor: pointer;
  }


  /* Scholar step */
  .step {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .step-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 56px;
  }
  .step-top img { height: 56px; width: auto; display: block; }
  .home-link { padding: 0; border: 0; background: none; border-radius: 12px; cursor: pointer; }
  .home-link:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  .link-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 10px 0 4px;
    border: 0;
    background: none;
    color: var(--royal);
    font: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
  }
  .link-back::before {
    content: "";
    width: 10px; height: 10px;
    border-left: 3px solid currentColor; border-bottom: 3px solid currentColor;
    border-radius: 2px;
    transform: rotate(45deg);
  }
  .link-back:focus-visible, .scholar:focus-visible, .change:focus-visible, .primary:focus-visible, .retry:focus-visible {
    outline: 4px solid var(--gold);
    outline-offset: 2px;
  }
  .step-title {
    text-align: center;
    margin: 6px 0 12px;
    font-weight: 800;
    font-size: clamp(1.7rem, 7.5vw, 2.1rem);
    line-height: 1.1;
    color: var(--royal);
  }
  .search {
    width: 100%;
    min-height: 56px;
    padding: 0 16px;
    border: 3px solid var(--royal);
    border-radius: 16px;
    background: var(--white);
    color: var(--ink);
    font: inherit;
    font-size: 1.15rem; /* 16px+ stops iPhones from zooming in */
  }
  .search:focus { outline: 4px solid var(--gold); outline-offset: 1px; }
  .search::placeholder { color: #6872A8; }
  .list {
    flex: 1 1 auto;
    min-height: 0;
    margin: 12px -4px 12px;
    padding: 0 4px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .scholar {
    display: block;
    width: 100%;
    margin: 0 0 8px;
    padding: 10px 14px;
    border: 2px solid #D5DCFF;
    border-radius: 14px;
    background: var(--white);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .scholar:active, .scholar[aria-selected="true"] { background: var(--gold-soft); border-color: var(--gold); }
  .scholar-name { display: block; font-weight: 800; font-size: 1.15rem; line-height: 1.2; }
  .scholar-meta { display: block; font-weight: 600; font-size: 0.95rem; color: #4A5490; }
  .list-note { margin: 16px 4px; font-size: 1.05rem; line-height: 1.4; color: var(--ink); }
  .retry {
    margin-top: 8px;
    min-height: 48px;
    padding: 0 22px;
    border: 3px solid var(--royal);
    border-radius: 14px;
    background: var(--white);
    color: var(--royal);
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  .picked {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .picked-card {
    padding: 22px 18px;
    border: 3px solid var(--gold);
    border-radius: 20px;
    background: var(--white);
    text-align: center;
  }
  .picked-card .scholar-name { font-size: 1.6rem; }
  .picked-card .scholar-meta { margin-top: 4px; font-size: 1.05rem; }
  .change {
    margin: 14px auto 0;
    display: block;
    min-height: 44px;
    padding: 0 18px;
    border: 0;
    background: none;
    color: var(--royal);
    font: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .primary {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 18px;
    background: var(--royal);
    color: var(--white);
    font: inherit;
    font-weight: 800;
    font-size: 1.35rem;
    box-shadow: 0 5px 0 var(--royal-deep);
    cursor: pointer;
  }
  .primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--royal-deep); }




  /* Reason, ID, and agree steps */
  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -4px 12px; padding: 0 4px; }
  .step-text { margin: -4px auto 14px; max-width: 32ch; font-size: 1.1rem; line-height: 1.4; text-align: center; }
  .reason {
    display: flex; align-items: center; gap: 12px;
    width: 100%; margin: 0 0 8px; padding: 12px 14px; min-height: 56px;
    border: 2px solid #D5DCFF; border-radius: 14px;
    background: var(--white); color: var(--ink);
    font: inherit; font-weight: 700; font-size: 1.15rem; text-align: left; cursor: pointer;
  }
  .reason .dot {
    flex: none; width: 24px; height: 24px;
    border: 3px solid var(--royal); border-radius: 50%; background: var(--white);
  }
  .reason[aria-checked="true"] { border-color: var(--gold); background: var(--gold-soft); }
  .reason[aria-checked="true"] .dot { background: var(--royal); box-shadow: inset 0 0 0 4px var(--white); }
  .reason:focus-visible, .like-button:focus-within, .other-text:focus { outline: 4px solid var(--gold); outline-offset: 2px; }
  .other-box { margin: 0 0 12px; }
  .field-label { display: block; margin: 0 0 6px; font-weight: 800; font-size: 1.05rem; color: var(--royal); }
  .other-text {
    width: 100%; padding: 12px 14px;
    border: 3px solid var(--royal); border-radius: 14px;
    font: inherit; font-size: 1.1rem; resize: none; color: var(--ink);
  }
  .primary:disabled { background: #A9B3E6; box-shadow: 0 5px 0 #8A95CC; cursor: not-allowed; }
  .id-area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .id-buttons { display: grid; gap: 12px; }
  .like-button { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .secondary {
    min-height: 56px; border: 3px solid var(--royal); border-radius: 18px;
    background: var(--white); color: var(--royal);
    font-weight: 800; font-size: 1.2rem; cursor: pointer;
  }
  .file-input { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
  .id-preview { border: 4px solid var(--gold); border-radius: 18px; background: var(--white); padding: 8px; text-align: center; }
  .id-preview img { max-width: 100%; max-height: 38vh; border-radius: 10px; display: block; margin: 0 auto; }
  .agree-card {
    padding: 18px 16px; border: 3px solid var(--royal); border-radius: 18px;
    background: var(--white); font-size: 1.15rem; line-height: 1.45;
  }
  .agree-card p { margin: 0; }
  .scroll-center { display: flex; flex-direction: column; }
  .scroll-center > .center-inner { width: 100%; max-width: 420px; margin: auto; }
  .summary {
    margin-top: 14px; padding: 14px 16px;
    border: 2px solid #D5DCFF; border-radius: 18px;
    background: var(--white); text-align: left;
    display: grid; gap: 10px;
  }
  .summary-label { display: block; font-weight: 600; font-size: 0.95rem; line-height: 1.2; color: #4A5490; }
  .summary-value { display: block; font-weight: 800; font-size: 1.2rem; line-height: 1.25; color: var(--ink); }
  .agree-card + .summary { margin-top: 14px; }
  .agree-card.hidden + .summary { margin-top: 0; }

  /* How can we help you today */
  .purpose-list { display: grid; gap: 16px; }
  .purpose {
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
    width: 100%; min-height: 128px; padding: 18px 20px;
    border: 0; border-radius: 20px;
    font: inherit; text-align: center; cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .purpose:active { transform: translateY(5px); }
  .purpose:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
  .purpose-name { font-weight: 800; font-size: 1.6rem; line-height: 1.1; }
  .purpose-desc { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
  .purpose.early { background: var(--gold); color: var(--royal-deep); box-shadow: 0 6px 0 #C99400; }
  .purpose.early:active { box-shadow: 0 1px 0 #C99400; }
  .purpose.late { background: var(--royal); color: var(--white); box-shadow: 0 6px 0 var(--royal-deep); }
  .purpose.late:active { box-shadow: 0 1px 0 var(--royal-deep); }
  .purpose.late:focus-visible { outline-color: var(--gold); }
  .purpose.early:focus-visible { outline-color: var(--royal); }

  /* The one orchestrated moment */
  .play .panther { animation: rise 0.9s cubic-bezier(0.22, 1.25, 0.4, 1) 0.15s forwards; }
  .play .sun { animation: pop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1) 0.75s forwards; }
  .play .welcome-title { animation: pop-in 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) 1s forwards; }
  .play .pick { animation: slide-in 0.45s ease-out 1.35s forwards; }
  .play .hours { animation: slide-in 0.45s ease-out 1.55s forwards; }

  @keyframes rise { to { transform: translateY(0); } }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes pop-in { to { opacity: 1; transform: scale(1); } }
  @keyframes slide-in { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .panther, .sun, .welcome-title, .pick, .hours { transform: none !important; opacity: 1 !important; animation: none !important; }
  }

  /* Short phones */
  @media (max-height: 760px) {
    .welcome-title { font-size: clamp(2rem, 9vw, 2.6rem); }
    .panther { height: min(27vh, 56vw); }
    .sun { width: min(62vw, 30vh); }
  }
  @media (max-height: 640px) {
    .welcome-title { font-size: clamp(1.7rem, 8.4vw, 2.4rem); }
    .panther { height: 22vh; }
    .sun { width: 25vh; }
    .pick { margin-top: 6px; }
    .agree-card { padding: 12px 14px; font-size: 1rem; line-height: 1.4; }
    .lang { min-height: 50px; font-size: 1.2rem; }
    .pick-prompt { font-size: 0.95rem; margin-bottom: 8px; }
    .lang-list { gap: 8px; }
  }
</style>
</head>
<body>

  <!-- Screen 1: Welcome and language -->
  <main class="screen" id="welcome">
    <h1 class="welcome-title">Welcome to BPES!</h1>

    <div class="stage">

  // Shrinks the photo so it uploads fast on a phone connection
  async function shrinkPhoto(file, maxSide = 1280) {
    let src, w, h, cleanup = () => {};
    if (window.createImageBitmap) {
      try {
        src = await createImageBitmap(file, { imageOrientation: "from-image" });
        w = src.width; h = src.height; cleanup = () => src.close && src.close();
      } catch (e) { src = null; }
    }
    if (!src) {
      src = await new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Bad image")); };
        img.src = url;
      });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    const scale = Math.min(1, maxSide / Math.max(w, h));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext("2d").drawImage(src, 0, 0, canvas.width, canvas.height);
    cleanup();
    const data = canvas.toDataURL("image/jpeg", 0.8);
    if (!data || data.length < 1000) throw new Error("Empty image");
    return data;
  }

    const total = answers.scholars.length;

    try {
      for (const s of todo) {
        if (total > 1) btn.textContent = w.sendingCount({ done: sentNames.size + 1, total });
        const payload = {
          type: isEarly() ? "early" : "late", // Make uses this to pick the tab and photo folder
          language: answers.language === "es" ? "Spanish" : "English",
          scholar: s.n,
          grade: s.g,
          advisory: s.a,
          reason: reasonText("en"), // saved in English for staff
          agreed: isEarly() ? "" : "Yes",
          // Photo without the "data:image/jpeg;base64," part, so Make can turn it into a file
          photo: answers.idPhoto ? answers.idPhoto.split(",")[1] : ""
        };
        if (WEBHOOK_URL) {
          // Sent as a regular form post so the browser sends it straight to Make
          const res = await fetch(WEBHOOK_URL, { method: "POST", body: new URLSearchParams(payload) });
          if (!res.ok) throw new Error("Not saved");
        } else {
          // Test mode: nothing is sent anywhere
          await new Promise(r => setTimeout(r, 900));
          console.log("TEST submission (not sent):", { ...payload, photo: payload.photo ? "(photo attached)" : "" });
        }
        sentNames.add(s.n);
      }
      $("thanks-title").textContent = w.thanksTitle;
      $("thanks-text").textContent = total > 1 ? w.thanksTextMany : w.thanksText;
      $("thanks-home").textContent = w.home;
      show(thanks);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = isEarly() ? w.submitEarly : w.submit;
      $("submit-error").textContent = w.submitError;
      $("submit-error").classList.remove("hidden");
    }
  });

  // Start over for the next family: Thank You button, or the Panther in the top corner
  function goHome() {
    Object.assign(answers, { language: null, type: null, scholars: [], reasonIndex: null, otherText: "", idPhoto: null });
    sentNames.clear();
    skippedPhoto = false;
    $("search").value = "";
    $("other-text").value = "";
    document.documentElement.lang = "en";
    show(welcome);
    welcome.classList.remove("play");
    void welcome.offsetWidth; // restarts the welcome animation
    welcome.classList.add("play");
    if (window.replayConfetti) window.replayConfetti();
  }
  $("thanks-home").addEventListener("click", goHome);
  document.querySelectorAll(".step-top img").forEach(img => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "home-link";
    img.parentNode.insertBefore(btn, img);
    btn.appendChild(img);
    btn.addEventListener("click", goHome);
  });

  // Confetti burst from behind the Panther
  (function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const colors = ["#1A35C9", "#FFC21A", "#6D8CFF", "#FFE48A", "#10227F"];
    let w, h, pieces = [];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    function size() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener("resize", size);

    function burst() {
      for (let i = 0; i < 140; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 9;
        pieces.push({
          x: w / 2, y: h / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 6 + Math.random() * 7,
          color: colors[i % colors.length],
          spin: Math.random() * Math.PI,
          spinSpeed: (Math.random() - 0.5) * 0.3,
          round: Math.random() < 0.3,
          life: 0
        });
      }
      requestAnimationFrame(tick);
    }

    function tick() {
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(p => {
        p.vy += 0.22;
        p.vx *= 0.985;
        p.x += p.vx; p.y += p.vy;
        p.spin += p.spinSpeed;
        p.life++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / 170);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        ctx.fillStyle = p.color;
        if (p.round) {
          ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        }
        ctx.restore();
      });
      pieces = pieces.filter(p => p.life < 170 && p.y < h + 40);
      if (pieces.length) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, w, h);
    }

    // Fire when the Panther lands
    setTimeout(burst, 800);
    window.replayConfetti = () => { pieces = []; size(); setTimeout(burst, 800); };
  })();
</script>
